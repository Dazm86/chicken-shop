<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرغ فروشی</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f7f7f7;color:#222}.wrap{max-width:1000px;margin:auto;padding:24px}.hero{background:white;border-radius:18px;padding:28px;box-shadow:0 4px 18px #0001}.status{display:inline-block;padding:7px 12px;border-radius:20px;background:#e7f7ec;color:#16733a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:20px}.card{background:white;border-radius:14px;padding:18px;border:1px solid #eee}.muted{color:#777}</style></head>
<body><div class="wrap"><div class="hero"><h1 id="name">مرغ فروشی</h1><span class="status" id="status">در حال بررسی...</span><p class="muted">فروشگاه آنلاین مرغ و محصولات پروتئینی</p><div class="grid"><div class="card"><h3>محصولات</h3><p>به‌زودی محصولات فروشگاه اینجا نمایش داده می‌شوند.</p></div><div class="card"><h3>سبد خرید</h3><p>سبد خرید در مرحله بعد فعال می‌شود.</p></div><div class="card"><h3>حساب کاربری</h3><p>ورود با شماره موبایل در ادامه اضافه می‌شود.</p></div></div></div></div><script>fetch('/api/store').then(r=>r.json()).then(x=>{if(x.success){document.getElementById('name').textContent=x.store.store_name;document.getElementById('status').textContent=x.store.is_open?'فروشگاه باز است':'فروشگاه بسته است';document.getElementById('status').style.background=x.store.is_open?'#e7f7ec':'#fdeaea';document.getElementById('status').style.color=x.store.is_open?'#16733a':'#a22'}}).catch(()=>document.getElementById('status').textContent='اتصال به سرور برقرار نشد')</script></body></html>
