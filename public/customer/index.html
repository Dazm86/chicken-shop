<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرغ فروشی بهار</title><style>body{margin:0;background:#faf8f4;color:#243;font:15px system-ui}.app{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 9px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}button,input{padding:9px;border-radius:8px;border:1px solid #ddd}button{background:#db6c2b;color:#fff;border:0}.muted{color:#778}.hidden{display:none}.pill{background:#e5f5e8;padding:5px 9px;border-radius:14px}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="app"><section class="card"><div class="row"><h1 id="title">مرغ فروشی</h1><span id="state" class="pill">...</span></div><p class="muted">فروشگاه آنلاین مرغ و پروتئین تازه</p><div id="login"><input id="phone" placeholder="0912..."><button onclick="otp()">دریافت رمز</button><span id="otpResult"></span><div id="verify" class="hidden"><input id="code" placeholder="رمز آزمایشی 123456"><button onclick="signin()">ورود</button></div></div><div id="account" class="hidden"><button onclick="history()">سفارش‌های من</button></div></section><section class="card"><h2>دسته‌بندی‌ها</h2><div id="categories" class="row"></div></section><section><h2>محصولات</h2><div id="products" class="grid"></div></section><section class="card"><div class="row"><h2>سبد خرید <span id="count">۰</span></h2><button onclick="checkout()">ادامه و ثبت سفارش</button></div><div id="cart" class="muted">سبد خرید خالی است.</div></section><section id="notice" class="card hidden"></section></main><script>let token=localStorage.customerToken||'',cart=JSON.parse(localStorage.customerCart||'[]');const api=(u,o={})=>fetch('/api'+u,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(o.headers||{})}}).then(r=>r.json());const msg=t=>{notice.textContent=t;notice.classList.remove('hidden')};function draw(){count.textContent=cart.reduce((n,x)=>n+x.quantity,0);cartEl=document.querySelector('#cart');cartEl.innerHTML=cart.map(x=>`<div class=row>${x.name} × ${x.quantity}<span><button onclick="change(${x.id},-1)">−</button> <button onclick="change(${x.id},1)">+</button></span></div>`).join('')||'سبد خرید خالی است.';localStorage.customerCart=JSON.stringify(cart)}function add(p){let x=cart.find(x=>x.id===p.id);x?x.quantity++:cart.push({...p,quantity:1});draw()}function change(id,n){let x=cart.find(x=>x.id===id);x.quantity+=n;if(x.quantity<1)cart=cart.filter(y=>y!==x);draw()}async function otp(){let x=await api('/auth/otp/request',{method:'POST',body:JSON.stringify({phone:phone.value})});otpResult.textContent=x.otp?'رمز آزمایشی: '+x.otp:x.error;verify.classList.remove('hidden')}async function signin(){let x=await api('/auth/otp/verify',{method:'POST',body:JSON.stringify({phone:phone.value,code:code.value})});if(!x.token)return msg(x.error);token=x.token;localStorage.customerToken=token;login.classList.add('hidden');account.classList.remove('hidden')}async function checkout(){if(!token)return msg('ابتدا وارد شوید');let a=(await api('/addresses')).addresses[0];if(!a){let province=prompt('استان'),city=prompt('شهر'),address=prompt('آدرس');let x=await api('/addresses',{method:'POST',body:JSON.stringify({province,city,address})});a=x.address}let x=await api('/orders',{method:'POST',body:JSON.stringify({items:cart.map(x=>({product_id:x.id,quantity:x.quantity})),address_id:a.id,payment_method:'cod',delivery_time:'اولین فرصت'})});if(x.success){cart=[];draw();msg('سفارش '+x.order.order_number+' ثبت شد.')}else msg(x.error)}async function history(){let x=await api('/orders');msg((x.orders||[]).map(o=>`${o.order_number} — ${o.status} — ${o.total_amount.toLocaleString()} تومان`).join('\n')||'هنوز سفارشی ندارید')}Promise.all([api('/store'),api('/categories'),api('/products')]).then(([s,c,p])=>{title.textContent=s.store.store_name;state.textContent=s.store.is_open?'فروشگاه باز است':'فروشگاه بسته است';categories.innerHTML=c.categories.map(x=>`<button>${x.name}</button>`).join('');products.innerHTML=p.products.map(x=>`<article class=card><b>${x.image_url||'🐔'} ${x.name}</b><p class=muted>${x.description||''}</p><p>${x.price.toLocaleString()} تومان / ${x.unit}</p><button onclick='add(${JSON.stringify(x)})'>افزودن</button></article>`).join('');if(token){login.classList.add('hidden');account.classList.remove('hidden')}draw()})</script></body></html>
