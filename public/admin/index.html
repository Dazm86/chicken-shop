<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت مرغ فروشی</title><style>body{font:15px system-ui;margin:0;background:#f5f6fa;color:#223}.app{max-width:1000px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button,input{padding:10px;border:1px solid #ddd;border-radius:8px}button{background:#34495e;color:#fff}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:right}</style></head><body><main class="app"><section id="login" class="card"><h1>پنل مدیریت</h1><p>ورود آزمایشی مالک: 09120000000</p><input id="phone" placeholder="شماره موبایل"><button onclick="enter()">ورود</button></section><section id="panel" class="hidden"><div class="card"><h1>داشبورد فروشگاه</h1><button onclick="load()">بروزرسانی</button><button onclick="toggle()">باز/بسته کردن فروشگاه</button><div id="stats" class="grid"></div></div><section class="card"><h2>آخرین سفارش‌ها</h2><div id="orders"></div></section><section class="card"><h2>محصولات و موجودی</h2><div id="products"></div></section></section></main><script>let token=localStorage.adminToken||'';const api=(u,o={})=>fetch('/api/admin'+u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}}).then(r=>r.json());async function enter(){let x=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value})}).then(r=>r.json());if(!x.token)return alert(x.error);token=x.token;localStorage.adminToken=token;login.classList.add('hidden');panel.classList.remove('hidden');load()}async function load(){let x=await api('/dashboard');if(!x.success)return alert(x.error);stats.innerHTML=[['وضعیت',x.store.is_open?'باز':'بسته'],['سفارش جدید',x.new_orders.count],['سفارش امروز',x.today_orders.count],['فروش امروز',x.today_sales.total.toLocaleString()]].map(a=>`<div class=card><b>${a[0]}</b><p>${a[1]}</p></div>`).join('');orders.innerHTML=`<table>${x.recent.map(o=>`<tr><td>${o.order_number}</td><td>${o.phone}</td><td>${o.status}</td><td><button onclick="status(${o.id},'confirmed')">تأیید</button></td></tr>`).join('')}</table>`;let p=await api('/products');products.innerHTML=`<table>${p.products.map(x=>`<tr><td>${x.name}</td><td>${x.stock}</td><td>${x.price}</td></tr>`).join('')}</table>`}async function toggle(){let x=await api('/dashboard');await api('/store',{method:'PATCH',body:JSON.stringify({is_open:x.store.is_open?0:1})});load()}async function status(id,status){await api('/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});load()}if(token){login.classList.add('hidden');panel.classList.remove('hidden');load()}</script></body></html>
