<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت مرغ فروشی</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Vazirmatn,sans-serif;background:#f3f4f6;color:#222;overflow-x:hidden}
header{background:#222;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}header b{font-size:16px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}#tabs button{flex:none;min-height:42px;padding:0 14px;border:1px solid #ddd;background:#fff;border-radius:10px}#tabs button.on{background:#c0392b;color:#fff;border-color:#c0392b}
main{padding:10px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0001;min-width:0}
.btn{min-height:42px;padding:0 14px;border:0;border-radius:10px;background:#c0392b;color:#fff}.btn.alt{background:#e5e7eb;color:#222}.btn.red{background:#7f1d1d}.btn.full{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;flex-wrap:wrap}.row:last-child{border:0}.muted{color:#777;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#fff;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:20px;margin-top:4px}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid #ccc;border-radius:10px;margin:4px 0 8px;font:inherit;background:#fff}input[type=checkbox]{width:auto;min-height:0}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}#modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
#toast{position:fixed;top:60px;inset-inline:12px;z-index:30;pointer-events:none}#toast div{background:#333;color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:6px}#toast .err{background:#b42323}
.badge{font-size:12px;padding:2px 8px;border-radius:8px;background:#eef}.on-b{background:#e3f6e8;color:#1b7a3a}.off-b{background:#fde6e6;color:#b42323}.empty{text-align:center;color:#777;padding:24px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}
</style></head><body>
<div id="root"></div><div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fa=n=>Number(n||0).toLocaleString('fa-IR');
const A={token:localStorage.getItem('adm_token'),me:null,tab:'dash'};
const ST={new:'جدید',confirmed:'تأیید شده',preparing:'در حال آماده‌سازی',shipped:'ارسال شده',delivered:'تحویل شده',cancelled:'لغو شده'},NEXT={new:'confirmed',confirmed:'preparing',preparing:'shipped',shipped:'delivered'},PS={pending:'در انتظار پرداخت',paid:'پرداخت شده',failed:'ناموفق',refunded:'بازگشت وجه'};
const DAYS=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.className='err';$('#toast').append(d);setTimeout(()=>d.remove(),3500)}
async function api(m,u,b){const r=await fetch('/api/admin'+u,{method:m,headers:{'Content-Type':'application/json',...(A.token?{Authorization:'Bearer '+A.token}:{})},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&A.token){A.token=null;A.me=null;localStorage.removeItem('adm_token');login()}if(!r.ok||j.success===false)throw new Error(j.error||'خطا در ارتباط با سرور');return j}
function modal(h){$('#modal').innerHTML='<div class="sheet">'+h+'<button class="btn alt full" style="margin-top:8px" data-a="close">بستن</button></div>';$('#modal').classList.add('show')}
const closeM=()=>{$('#modal').classList.remove('show');$('#modal').innerHTML=''};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
function login(step,phone,hint){$('#root').innerHTML=`<div class="card" style="max-width:400px;margin:40px auto"><h3>ورود به پنل مدیریت</h3>${step===2?`<div class="muted">کد آزمایشی (بدون پیامک واقعی): <b>${esc(hint)}</b></div><input id="cd" inputmode="numeric" maxlength="6" placeholder="کد تأیید"><button class="btn full" data-a="verify" data-p="${esc(phone)}">ورود</button>`:`<input id="ph" type="tel" inputmode="numeric" placeholder="شماره موبایل مدیر"><button class="btn full" data-a="otp">دریافت کد</button>`}</div>`}
const TABS=[['dash','داشبورد'],['orders','سفارش‌ها'],['products','محصولات'],['cats','دسته‌ها'],['disc','تخفیف‌ها'],['cust','مشتریان'],['set','تنظیمات'],['admins','مدیران'],['logs','لاگ‌ها']];
function shell(){$('#root').innerHTML=`<header><b>پنل مدیریت</b><span>${esc(A.me.name)} (${A.me.role==='owner'?'مدیر اصلی':'مدیر'}) <button class="btn alt" data-a="logout">خروج</button></span></header><div id="tabs">${TABS.filter(t=>t[0]!=='admins'||A.me.role==='owner').map(([k,t])=>`<button data-a="tab" data-k="${k}" class="${A.tab===k?'on':''}">${t}</button>`).join('')}</div><main id="v"><div class="empty">در حال بارگذاری...</div></main>`;show()}
async function show(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===A.tab));try{$('#v').innerHTML=await V[A.tab]()}catch(e){$('#v').innerHTML='<div class="empty">خطا: '+esc(e.message)+'</div>'}}
const form=(title,fields,vals,act,extra)=>modal(`<h3>${title}</h3>${fields.map(f=>{const v=vals[f.k]??'';return`<label class="muted">${f.l}</label>`+(f.t==='check'?`<div><input type="checkbox" id="f_${f.k}" ${v?'checked':''}></div>`:f.t==='sel'?`<select id="f_${f.k}">${f.o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(v)}">`)}).join('')}<button class="btn full" data-a="${act}" ${extra||''}>ذخیره</button>`);
const val=fs=>Object.fromEntries(fs.map(f=>{const e=$('#f_'+f.k);return[f.k,f.t==='check'?e.checked:e.value]}));
const PF=[{k:'name',l:'نام *'},{k:'description',l:'توضیحات'},{k:'price',l:'قیمت (تومان)',t:'number'},{k:'unit',l:'واحد',t:'sel',o:[['kg','کیلوگرم'],['pcs','عدد']]},{k:'stock',l:'موجودی',t:'number'},{k:'category_id',l:'دسته',t:'sel',o:[]},{k:'image_url',l:'آدرس تصویر'},{k:'active',l:'فعال',t:'check'}];
const CF=[{k:'name',l:'نام *'},{k:'sort_order',l:'ترتیب',t:'number'},{k:'active',l:'فعال',t:'check'}];
const DF=[{k:'code',l:'کد *'},{k:'type',l:'نوع',t:'sel',o:[['percent','درصدی'],['fixed','مبلغ ثابت']]},{k:'value',l:'مقدار',t:'number'},{k:'min_order_amount',l:'حداقل سفارش',t:'number'},{k:'usage_limit',l:'سقف استفاده (خالی = نامحدود)',t:'number'},{k:'starts_at',l:'شروع',t:'date'},{k:'ends_at',l:'پایان',t:'date'},{k:'active',l:'فعال',t:'check'}];
const num=(o,ks)=>{ks.forEach(k=>{if(o[k]===''||o[k]==null)o[k]=null;else o[k]=Number(o[k])});return o};
const V={
 async dash(){const{dashboard:d}=await api('GET','/dashboard');return`<div class="card row"><span>وضعیت فروشگاه</span><span class="badge ${d.store_open?'on-b':'off-b'}">${d.store_open?'باز':'بسته'}</span></div><div class="stats"><div class="stat">سفارش‌های جدید<b>${fa(d.new_orders)}</b></div><div class="stat">سفارش‌های امروز<b>${fa(d.today_orders)}</b></div><div class="stat">فروش امروز (تومان)<b>${fa(d.today_sales)}</b></div><div class="stat">در حال ارسال<b>${fa(d.shipping_orders)}</b></div></div><h4>آخرین سفارش‌ها</h4>${d.recent_orders.length?d.recent_orders.map(o=>`<div class="card row" data-a="odet" data-id="${o.id}"><b>${esc(o.order_number)}</b><span class="badge">${ST[o.status]}</span><span>${fa(o.total_amount)}</span></div>`).join(''):'<div class="empty">سفارشی نیست.</div>'}`},
 async orders(){const{orders}=await api('GET','/orders'+(A.of?'?status='+A.of:''));return`<select data-a="of"><option value="">همه وضعیت‌ها</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${A.of===k?'selected':''}>${v}</option>`).join('')}</select>`+(orders.length?orders.map(o=>`<div class="card" data-a="odet" data-id="${o.id}"><div class="row"><b>${esc(o.order_number)}</b><span class="badge">${ST[o.status]}</span></div><div class="row"><span>${esc(o.customer_phone)}</span><span>${fa(o.total_amount)} تومان</span></div><div class="muted">${PS[o.payment_status]}</div></div>`).join(''):'<div class="empty">سفارشی یافت نشد.</div>')},
 async products(){const[{products:p},{categories:c}]=await Promise.all([api('GET','/products'),api('GET','/categories')]);A.cats=c;return`<button class="btn full" data-a="padd">+ محصول جدید</button><div class="card" style="margin-top:10px">${p.length?p.map(x=>`<div class="row"><span><b>${esc(x.name)}</b><div class="muted">${fa(x.price)} تومان · موجودی ${fa(x.stock)} · ${esc(x.category_name||'بدون دسته')}</div></span><span><span class="badge ${x.active?'on-b':'off-b'}">${x.active?'فعال':'غیرفعال'}</span> <button class="btn alt" data-a="pedit" data-id="${x.id}">ویرایش</button> <button class="btn red" data-a="pdel" data-id="${x.id}">حذف</button></span></div>`).join(''):'<div class="empty">محصولی نیست.</div>'}</div>`},
 async cats(){const{categories:c}=await api('GET','/categories');A.cats=c;return`<button class="btn full" data-a="cadd">+ دسته جدید</button><div class="card" style="margin-top:10px">${c.length?c.map(x=>`<div class="row"><span>${esc(x.name)} <span class="badge ${x.active?'on-b':'off-b'}">${x.active?'فعال':'غیرفعال'}</span></span><span><button class="btn alt" data-a="cedit" data-id="${x.id}">ویرایش</button> <button class="btn red" data-a="cdel" data-id="${x.id}">حذف</button></span></div>`).join(''):'<div class="empty">دسته‌ای نیست.</div>'}</div>`},
 async disc(){const{discounts:d}=await api('GET','/discounts');A.discs=d;return`<button class="btn full" data-a="dadd">+ کد تخفیف جدید</button><div class="card" style="margin-top:10px">${d.length?d.map(x=>`<div class="row"><span><b>${esc(x.code)}</b> <span class="badge ${x.active?'on-b':'off-b'}">${x.active?'فعال':'غیرفعال'}</span><div class="muted">${x.type==='percent'?fa(x.value)+'٪':fa(x.value)+' تومان'} · حداقل ${fa(x.min_order_amount)} · استفاده ${fa(x.usage_count)}${x.usage_limit!=null?'/'+fa(x.usage_limit):''}</div></span><span><button class="btn alt" data-a="dedit" data-id="${x.id}">ویرایش</button> <button class="btn red" data-a="ddel" data-id="${x.id}">حذف</button></span></div>`).join(''):'<div class="empty">کدی نیست.</div>'}</div>`},
 async cust(){const{customers:c}=await api('GET','/customers');return c.length?`<div class="card scroll"><table><tr><th>موبایل</th><th>سفارش‌ها</th><th>مجموع خرید</th><th>عضویت</th></tr>${c.map(x=>`<tr><td>${esc(x.phone)}</td><td>${fa(x.order_count)}</td><td>${fa(x.total_spent)}</td><td>${esc(new Date(x.created_at.replace(' ','T')+'Z').toLocaleDateString('fa-IR'))}</td></tr>`).join('')}</table></div>`:'<div class="empty">مشتری‌ای نیست.</div>'},
 async set(){const{store:s,delivery:d,business_hours:h}=await api('GET','/settings');A.set={s,d,h};const mode=s.manual_status?(s.is_open?'دستی: باز':'دستی: بسته'):'خودکار (طبق ساعات کاری)';
  return`<div class="card"><b>وضعیت فروشگاه: ${mode}</b><div class="row"><button class="btn" data-a="sopen">باز کردن فروشگاه</button><button class="btn red" data-a="sclose">بستن فروشگاه</button><button class="btn alt" data-a="sauto">حالت خودکار</button></div></div>
  <div class="card"><b>اطلاعات فروشگاه</b><label class="muted">نام</label><input id="s_n" value="${esc(s.store_name)}"><label class="muted">شماره تماس</label><input id="s_p" value="${esc(s.phone||'')}"><label class="muted">آدرس</label><input id="s_a" value="${esc(s.address||'')}"><label class="muted">حداقل مبلغ سفارش (تومان)</label><input id="s_m" type="number" value="${s.min_order_amount}"><button class="btn full" data-a="ssave">ذخیره</button></div>
  <div class="card"><b>هزینه ارسال</b><div><input type="checkbox" id="d_e" ${d.enabled?'checked':''}> ارسال با هزینه فعال</div><label class="muted">هزینه ارسال (تومان)</label><input id="d_f" type="number" value="${d.delivery_fee}"><label class="muted">ارسال رایگان از مبلغ</label><input id="d_m" type="number" value="${d.free_delivery_min_amount}"><button class="btn full" data-a="dsave">ذخیره</button></div>
  <div class="card"><b>ساعات کاری</b>${DAYS.map((n,i)=>{const r=h.find(x=>x.day_of_week===i)||{};return`<div class="row"><span>${n}</span><span><input type="checkbox" id="h_c${i}" ${r.closed?'checked':''}> تعطیل <input type="time" id="h_o${i}" value="${r.open_time||''}" style="width:auto"> <input type="time" id="h_x${i}" value="${r.close_time||''}" style="width:auto"></span></div>`}).join('')}<button class="btn full" data-a="hsave">ذخیره ساعات</button></div>`},
 async admins(){const{admins:a}=await api('GET','/users');return`<button class="btn full" data-a="aadd">+ مدیر جدید</button><div class="card" style="margin-top:10px">${a.map(x=>`<div class="row"><span>${esc(x.name)} · ${esc(x.phone)} <span class="badge">${x.role==='owner'?'مدیر اصلی':'مدیر'}</span></span>${x.id===A.me.id?'':`<button class="btn red" data-a="adel" data-id="${x.id}">حذف</button>`}</div>`).join('')}</div>`},
 async logs(){const{logs:l}=await api('GET','/logs');return l.length?`<div class="card scroll"><table><tr><th>زمان</th><th>مدیر</th><th>عملیات</th><th>جزئیات</th></tr>${l.map(x=>`<tr><td>${esc(new Date(x.created_at.replace(' ','T')+'Z').toLocaleString('fa-IR'))}</td><td>${esc(x.admin_name||x.admin_phone||'-')}</td><td>${esc(x.action)}</td><td>${esc(x.details||'')}</td></tr>`).join('')}</table></div>`:'<div class="empty">لاگی نیست.</div>'}
};
const catOpts=()=>[['','بدون دسته'],...(A.cats||[]).map(c=>[c.id,c.name])];
const withCats=()=>PF.map(f=>f.k==='category_id'?{...f,o:catOpts()}:f);
let cur;const after=async m=>{closeM();toast(m);show()};
const run=async(fn,m)=>{try{await fn();await after(m)}catch(e){toast(e.message,1)}};
const acts={close:closeM,
 async otp(){const phone=$('#ph').value;try{const r=await api('POST','/login/request-otp',{phone});login(2,phone,r.dev_code)}catch(e){toast(e.message,1)}},
 async verify(d){try{const r=await api('POST','/login/verify-otp',{phone:d.p,code:$('#cd').value});A.token=r.token;localStorage.setItem('adm_token',r.token);A.me=r.admin;shell()}catch(e){toast(e.message,1)}},
 async logout(){try{await api('POST','/logout',{})}catch(e){}A.token=null;localStorage.removeItem('adm_token');login()},
 tab(d){A.tab=d.k;show()},of(){},
 async odet(d){try{const{order:o}=await api('GET','/orders/'+d.id);const nx=NEXT[o.status],can=['new','confirmed','preparing'].includes(o.status);
  modal(`<h3>${esc(o.order_number)} <span class="badge">${ST[o.status]}</span></h3><div class="row"><span>مشتری</span><a href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a></div><div class="row"><span>آدرس</span><span>${esc(o.address_text||'-')}</span></div>${o.latitude!=null?`<div class="row"><span>مختصات</span><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${Number(o.latitude)}&mlon=${Number(o.longitude)}#map=17/${Number(o.latitude)}/${Number(o.longitude)}">${esc(o.latitude)}, ${esc(o.longitude)} (نقشه)</a></div>`:''}<div class="row"><span>پرداخت</span><b>${PS[o.payment_status]} (${o.payment_method==='online'?'اینترنتی':'درب منزل'})</b></div>${o.items.map(i=>`<div class="row"><span>${esc(i.product_name)} × ${fa(i.quantity)}</span><b>${fa(i.total_price)}</b></div>`).join('')}<div class="row"><span>تخفیف / ارسال</span><span>${fa(o.discount_amount)} / ${fa(o.delivery_fee)}</span></div><div class="row"><b>مبلغ نهایی</b><b>${fa(o.total_amount)} تومان</b></div>${o.delivery_time?`<div class="muted">زمان ارسال: ${esc(o.delivery_time)}</div>`:''}${o.notes?`<div class="muted">توضیحات: ${esc(o.notes)}</div>`:''}
  ${nx?`<button class="btn full" style="margin-top:8px" data-a="ost" data-id="${o.id}" data-s="${nx}">تغییر به «${ST[nx]}»</button>`:''}${can?`<button class="btn red full" style="margin-top:8px" data-a="ocancel" data-id="${o.id}">لغو سفارش</button>`:''}`)}catch(e){toast(e.message,1)}},
 ost(d){run(()=>api('PUT',`/orders/${d.id}/status`,{status:d.s}),'وضعیت تغییر کرد')},
 ocancel(d){if(confirm('سفارش لغو شود؟'))run(()=>api('POST',`/orders/${d.id}/cancel`,{}),'سفارش لغو شد')},
 padd(){cur=null;form('محصول جدید',withCats(),{active:true,unit:'kg'},'psave')},
 async pedit(d){const{products:p}=await api('GET','/products');cur=p.find(x=>x.id==d.id);form('ویرایش محصول',withCats(),cur,'psave')},
 psave(){const b=num(val(PF),['price','stock','category_id']);run(()=>cur?api('PUT','/products/'+cur.id,b):api('POST','/products',b),'ذخیره شد')},
 pdel(d){if(confirm('محصول حذف شود؟'))run(()=>api('DELETE','/products/'+d.id),'حذف شد')},
 cadd(){cur=null;form('دسته جدید',CF,{active:true,sort_order:0},'csave')},
 cedit(d){cur=A.cats.find(x=>x.id==d.id);form('ویرایش دسته',CF,cur,'csave')},
 csave(){const b=num(val(CF),['sort_order']);run(()=>cur?api('PUT','/categories/'+cur.id,b):api('POST','/categories',b),'ذخیره شد')},
 cdel(d){if(confirm('دسته حذف شود؟'))run(()=>api('DELETE','/categories/'+d.id),'حذف شد')},
 dadd(){cur=null;form('کد تخفیف جدید',DF,{active:true,type:'percent'},'dcsave')},
 dedit(d){cur=A.discs.find(x=>x.id==d.id);form('ویرایش کد تخفیف',DF,{...cur,starts_at:(cur.starts_at||'').slice(0,10),ends_at:(cur.ends_at||'').slice(0,10)},'dcsave')},
 dcsave(){const b=num(val(DF),['value','min_order_amount','usage_limit']);b.starts_at=b.starts_at?b.starts_at+'T00:00:00.000Z':null;b.ends_at=b.ends_at?b.ends_at+'T23:59:59.000Z':null;run(()=>cur?api('PUT','/discounts/'+cur.id,b):api('POST','/discounts',b),'ذخیره شد')},
 ddel(d){if(confirm('کد حذف شود؟'))run(()=>api('DELETE','/discounts/'+d.id),'حذف شد')},
 sopen(){run(()=>api('PUT','/settings/store',{manual_status:true,is_open:true}),'فروشگاه باز شد')},
 sclose(){run(()=>api('PUT','/settings/store',{manual_status:true,is_open:false}),'فروشگاه بسته شد')},
 sauto(){run(()=>api('PUT','/settings/store',{manual_status:false}),'حالت خودکار فعال شد')},
 ssave(){run(()=>api('PUT','/settings/store',{store_name:$('#s_n').value,phone:$('#s_p').value,address:$('#s_a').value,min_order_amount:Number($('#s_m').value)||0}),'ذخیره شد')},
 dsave(){run(()=>api('PUT','/settings/delivery',{enabled:$('#d_e').checked,delivery_fee:Number($('#d_f').value)||0,free_delivery_min_amount:Number($('#d_m').value)||0}),'ذخیره شد')},
 hsave(){run(()=>api('PUT','/settings/business-hours',{hours:DAYS.map((_,i)=>({day_of_week:i,closed:$('#h_c'+i).checked,open_time:$('#h_o'+i).value||null,close_time:$('#h_x'+i).value||null}))}),'ساعات کاری ذخیره شد')},
 aadd(){form('مدیر جدید',[{k:'name',l:'نام *'},{k:'phone',l:'شماره موبایل *',t:'tel'}],{},'asave')},
 asave(){run(()=>api('POST','/users',val([{k:'name'},{k:'phone'}])),'مدیر اضافه شد')},

};
